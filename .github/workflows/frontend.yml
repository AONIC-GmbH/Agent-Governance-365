name: Deploy Frontend (Static Web App)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # The committed package-lock.json is generated on Windows and only contains
        # a package node for the win32 rollup binary, not @rollup/rollup-linux-x64-gnu
        # (npm/cli#4828). Removing the lockfile forces a fresh resolution on the Linux
        # runner so the correct platform-specific binary gets installed.
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_MOCK_MODE: "false"
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}

      - name: Include SPA routing config in build output
        run: cp frontend/staticwebapp.config.json frontend/dist/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
